name: antmillion-test

services:
  mysql-test:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13307:3306"
    environment:
      MYSQL_DATABASE: antmillion_test
      MYSQL_USER: antmillion_test
      MYSQL_PASSWORD: ${ANTMILLION_TEST_DB_PASSWORD:?Run scripts/Test-Trading.ps1}
      MYSQL_ROOT_PASSWORD: ${ANTMILLION_TEST_ROOT_PASSWORD:?Run scripts/Test-Trading.ps1}
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./src/test/resources/db/init:/docker-entrypoint-initdb.d:ro
      - ./db_schema/migrations/001-stock-active.sql:/opt/antmillion-migrations/001-stock-active.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u antmillion_test antmillion_test -Nse "SELECT marker FROM test_environment" | grep -qx antmillion-isolated-test-v1']
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 10s
